version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cutover_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cutover_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: cutover_fastapi_web
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/cutover_db
    depends_on:
      - db
    
  # streamlit is now at the same level as 'web' and 'db'
  streamlit:
    build: .
    container_name: cutover_streamlit_demo
    restart: always
    command: python -m streamlit run app/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/cutover_db
    depends_on:
      - db

volumes:
  postgres_data: